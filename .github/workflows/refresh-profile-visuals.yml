name: Refresh profile visuals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate engineering metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/generate-code-footprint.mjs

      - name: Commit refreshed visual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/code-footprint.svg
          if git diff --cached --quiet; then
            echo "Metrics are already current."
          else
            git commit -m "chore: refresh profile metrics"
            git push
          fi
